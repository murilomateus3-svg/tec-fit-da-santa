<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#176b3b"><title>Produto | Tec Fit da Santa</title><link rel="stylesheet" href="/styles.css"><style>
.product-page{min-height:100vh;background:#f5f8f3}.product-head{background:#fff;border-bottom:1px solid #e5ece4;padding:18px max(calc((100% - 1080px)/2),5%);display:flex;align-items:center}.product-main{max-width:960px;margin:55px auto;padding:0 22px}.product-card{background:#fff;border:1px solid #e3eae1;border-radius:18px;overflow:hidden;display:grid;grid-template-columns:1fr 1fr;box-shadow:0 18px 50px #183b1d0c}.product-photo{width:100%;height:100%;min-height:430px;object-fit:cover;background:#edf2e9}.product-info{padding:38px;display:flex;flex-direction:column;justify-content:center}.product-info .tag{color:#247446;font-size:11px;font-weight:800;letter-spacing:.13em;text-transform:uppercase}.product-info h1{font:800 36px Manrope;margin:12px 0;color:#183b25;letter-spacing:-1.5px}.product-info p{color:#68766d;line-height:1.8;font-size:14px}.product-price{font:900 42px Manrope;color:#d51f2a;margin:15px 0 4px}.product-price small{font-size:15px;color:#66756a}.product-benefits{background:#f3f8f1;padding:17px;border-radius:10px;margin-top:16px;color:#536358;font-size:13px;line-height:1.7}.product-note{font-size:11px;color:#8a968d;margin-top:22px}@media(max-width:700px){.product-main{margin:25px auto}.product-card{grid-template-columns:1fr}.product-photo{height:260px;min-height:0}.product-info{padding:25px}.product-info h1{font-size:29px}}
</style></head><body class="product-page"><header class="product-head"><a class="brand" href="/"><span class="brand-mark">T<span>F</span></span><span class="brand-name">tec fit<small>da santa</small></span></a></header><main class="product-main"><div id="productDetail" class="product-card"><div style="padding:35px">Carregando informações do produto...</div></div></main><script>
const id=location.pathname.split('/').filter(Boolean).pop();const money=n=>Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));fetch('/api/products/'+encodeURIComponent(id)).then(r=>{if(!r.ok)throw Error('Produto não encontrado');return r.json()}).then(p=>{const price=Number(p.promo_price)>0?Number(p.promo_price):Number(p.price);document.title=p.name+' | Tec Fit da Santa';document.querySelector('#productDetail').innerHTML=`${p.image?`<img class="product-photo" src="${esc(p.image)}" alt="${esc(p.name)}">`:'<div class="product-photo"></div>'}<section class="product-info"><span class="tag">${esc(p.category)} · Tec Fit da Santa</span><h1>${esc(p.name)}</h1><p>${esc(p.description||'Conheça este produto selecionado para você.')}</p>${price>0?`<div class="product-price">${money(price)} <small>/ ${esc(p.unit||'kg')}</small></div>${Number(p.promo_price)>0&&Number(p.price)>0?`<del style="color:#879188">De ${money(p.price)}</del>`:''}`:'<p>Consulte o preço na loja.</p>'}<div class="product-benefits"><strong>Informações e benefícios</strong><br>${esc(p.benefits||'Consulte a embalagem para informações completas.')}</div><p class="product-note">Preços e disponibilidade podem variar conforme a unidade e o período da oferta. Consulte a loja.</p></section>`}).catch(e=>document.querySelector('#productDetail').innerHTML=`<section class="product-info"><h1>Produto indisponível</h1><p>${esc(e.message)}</p><a href="/">Voltar ao Tec Fit da Santa</a></section>`);
</script></body></html>
