services:
  - type: web
    name: tec-fit-da-santa
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/me
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: tec-fit-da-santa-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PUBLIC_URL
        sync: false

databases:
  - name: tec-fit-da-santa-db
    plan: free
    databaseName: tecfitdasanta
    user: tecfitdasanta
